<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dados dos Animais</title>
</head>
<body>

     <header>
        <div>
            <h1>🐾Adota<span>Pet</span>.com</h1>
        </div>

        <nav>
            <a href="index.html">Voltar</a>
        </nav>
        <a href="cadastro.html">
            <button>Adote agora</button>
        </a>
        <button id="modoEscuro">Mudar Tema</button>
    </header>

    <main class="cadastro-main">
        <section class="titulo">
            <h1>Cadastro de Animais</h1>

            <form id="formulario">
                <label for="nomeAnimal">Nome do Animal:</label>
                <input type="text" id="nomeAnimal" placeholder="Digite o nome do animal..." required>
                <label for="idade">Idade do Animal:</label>
                <input type="number" id="idade" placeholder="Digite a idade dos animais..." required>
                <label for="tipo">Tipo do Animal:</label>
                <select id="especie" name="especie" required>
                    <option value="" selected disabled id="especie">selecione uma especie...</option>
                    <option value="Gato" id="especie">Gato</option>
                    <option value="cachorro" id="especie">Cachorro</option>
                </select>
                <label for="raca">Raça do Animal:</label>
                <input type="text" id="raca" placeholder="Digite a raça do animal..." required>
                <label for="sexo">Sexo do Animal:</label>
                <select id="sexo" name="sexo" required>
                    <option value="" selected disabled>selecione o sexo do animal...</option>
                    <option value="Masc">Masculino</option>
                    <option value="Fem">Feminino</option>
                </select>

                <label for="porte">Porte do Animal:</label>
                <select id="porte" name="porte" required>
                    <option value="" selected disabled>selecione o porte do animal...</option>
                    <option value="Pequeno">Pequeno</option>
                    <option value="Medio">Médio</option>
                    <option value="Grande">Grande</option>
                </select>

                <label for="cor">Cor do Animal:</label>
                <input type="text" id="cor" placeholder="Digite a cor do animal..." required>

                <label for="pelagem">Pelagem do Animal:</label>
                <input type="text" id="pelagem" placeholder="Digite a pelagem do animal...">

                <label for="cidade">Cidade do Animal:</label>
                <input type="text" id="cidade" placeholder="Digite a cidade do animal...">

                <label for="estado">Estado do Animal:</label>
                        <select id="estado" name="estado">
                            <option value="">Selecione o estado...</option>
                            <option value="AC">AC - Acre</option>
                            <option value="AL">AL - Alagoas</option>
                            <option value="AP">AP - Amapá</option>
                            <option value="AM">AM - Amazonas</option>
                            <option value="BA">BA - Bahia</option>
                            <option value="CE">CE - Ceará</option>
                            <option value="DF">DF - Distrito Federal</option>
                            <option value="ES">ES - Espírito Santo</option>
                            <option value="GO">GO - Goiás</option>
                            <option value="MA">MA - Maranhão</option>
                            <option value="MT">MT - Mato Grosso</option>
                            <option value="MS">MS - Mato Grosso do Sul</option>
                            <option value="MG">MG - Minas Gerais</option>
                            <option value="PA">PA - Pará</option>
                            <option value="PB">PB - Paraíba</option>
                            <option value="PR">PR - Paraná</option>
                            <option value="PE">PE - Pernambuco</option>
                            <option value="PI">PI - Piauí</option>
                            <option value="RJ">RJ - Rio de Janeiro</option>
                            <option value="RN">RN - Rio Grande do Norte</option>
                            <option value="RS">RS - Rio Grande do Sul</option>
                            <option value="RO">RO - Rondônia</option>
                            <option value="RR">RR - Roraima</option>
                            <option value="SC">SC - Santa Catarina</option>
                            <option value="SP">SP - São Paulo</option>
                            <option value="SE">SE - Sergipe</option>
                            <option value="TO">TO - Tocantins</option>
                        </select>

                <button type="submit">Enviar</button>
        </section>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
